# AI Anomaly Agent - configuration
# All thresholds live here so they can be tuned without touching code (PRD 9).

metrics:
  # Column name in the Excel file -> friendly display name
  revenue: "Revenue"
  orders: "Orders"
  conversion_rate: "Conversion Rate"
  traffic: "Traffic"
  cost: "Cost"
  refunds: "Refunds"

baseline:
  # Rolling window (days) used for the moving-average baseline
  moving_average_window: 7
  # Minimum number of historical rows required before we trust a baseline
  min_history_rows: 7

detection:
  # Percentage-change thresholds (absolute value, in %)
  pct_change_warning: 15
  pct_change_critical: 30
  # Z-score thresholds (absolute value)
  zscore_warning: 2.0
  zscore_critical: 3.0

severity:
  # Order matters: first match wins, evaluated worst -> best
  levels: ["Critical", "Warning", "Low", "Normal"]

alerts:
  # Only these severities trigger an email (PRD FR-08)
  notify_on: ["Warning", "Critical"]
  subject_prefix: "Business Anomaly Detected"

ai:
  # "openrouter" (default) or "openai". Switching only needs the 4 provider values below -
  # both speak the same Chat Completions protocol, so no code changes are required.
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"        # OpenAI direct: "https://api.openai.com/v1"
  # [OPENROUTER_API_KEY] - NAME of the environment variable holding the key.
  # The key itself is never stored in this file or in code.
  api_key_env_var: "OPENROUTER_API_KEY"           # OpenAI direct: "OPENAI_API_KEY"
  # OpenRouter model IDs are "<vendor>/<model>". Override per-environment with LLM_MODEL.
  model: "openai/gpt-5-mini"                      # OpenAI direct: "gpt-5-mini"
  # Optional OpenRouter-only extras (ignored when provider is "openai"):
  fallback_models: []                             # e.g. ["anthropic/claude-sonnet-4.5"] tried if the primary fails
  require_parameters: true                        # only route to providers that support every parameter we send
  data_collection: "deny"                         # "deny" = never route to providers that may store/train on prompts
  # Optional app attribution shown on openrouter.ai (headers are optional):
  site_url: null                                  # sent as HTTP-Referer; or set OPENROUTER_SITE_URL
  app_title: "AI Anomaly Agent"                   # sent as X-Title
  max_tokens: 2000
  # Reasoning models (gpt-5 family) reject `temperature`. Leave null for those;
  # set e.g. 0.2 only for non-reasoning models.
  temperature: null
  # Optional: "minimal" | "low" | "medium" | "high" (reasoning models only).
  reasoning_effort: null
  timeout_seconds: 60
  # Retries with exponential backoff for 429 / 5xx / connection errors (handled by the SDK).
  max_retries: 3

anomaly_analysis:
  # Local baseline = centred rolling median over this many rows (Hampel filter).
  window: 7
  min_periods: 3
  # Robust z-score = (x - rolling median) / (1.4826 * rolling MAD).
  robust_z_warning: 3.5     # standard Iglewicz-Hoaglin cut-off
  robust_z_critical: 6.0
  # Local scale is never allowed below this fraction of the series-wide robust
  # scale, so a lucky-tight 7-point window cannot turn ordinary noise into an alarm.
  scale_floor_ratio: 1.0
  # "interpolate" = replace flagged cells with estimates, keeping every date.
  # "drop_rows"   = remove any row that has a flagged cell.
  cleaning_strategy: "interpolate"
  output_dir: "outputs"
  chart_dpi: 300

database:
  url: "sqlite:///data/anomaly_agent.db"
